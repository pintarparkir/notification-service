name: notification-service CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.25.10'
  GCP_PROJECT_ID: pintarparkir
  GCP_REGION: asia-southeast1
  AR_REGION: asia-southeast2
  SERVICE_NAME: notification-service
  ARTIFACT_REGISTRY_REPO: parkirpintar

jobs:
  build-and-push:
    name: Build & push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          IMAGE="${{ env.AR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.AR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            PROJECT_ENV=production
            APP_NAME=notification-service
            APP_ENV=production
            RABBIT_EXCHANGE=parkirpintar.events
            RABBIT_QUEUE=notification-service
            RABBIT_DLQ=notification-service.dlq
            USER_GRPC_ADDR=user-service-725nddkmwq-as.a.run.app:443
            SMS_MODE=stub
            SMS_SENDER_ID=ParkirPintar
          secrets: |
            RABBIT_URL=rabbit-url:latest
          flags: >-
            --port=8080
            --allow-unauthenticated
            --min-instances=1
            --max-instances=2
            --memory=256Mi
            --cpu=1
            --timeout=300
            --vpc-connector=projects/pintarparkir/locations/asia-southeast1/connectors/parkirpintar-connector

      - name: Smoke test (non-blocking)
        continue-on-error: true
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          curl -sf --max-time 10 "${URL}/health" || echo "⚠️ Health check not yet reachable (may still be starting)"
